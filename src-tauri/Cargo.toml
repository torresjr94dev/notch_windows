[package]
name = "notch-windows"
version = "0.1.0"
description = "Dynamic Island para Windows"
authors = ["Jorge Torres"]
edition = "2024"
license = "MIT"

[lib]
# El sufijo `_lib` evita el choque de nombres entre lib y bin en Windows:
# https://github.com/rust-lang/cargo/issues/8519
name = "notch_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
